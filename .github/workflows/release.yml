name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Look for jar in root or release/ directory
          for jar in lemon-cleaned.jar release/lemon-cleaned.jar *.jar; do
            if [ -f "$jar" ]; then
              cp "$jar" release/lemon-cleaned.jar
              break
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
